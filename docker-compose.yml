version: "3.9"

services:
  football_analytics:
    build: .
    container_name: football_analytics_app
    ports:
      - "8502:8502"
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped